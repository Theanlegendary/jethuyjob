<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 38 39" width="38" height="39">
  <defs>
    <linearGradient id="predBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
  </defs>
  <rect x="2" y="2" width="34" height="35" rx="8" fill="#fff7ed" stroke="#ffedd5" stroke-width="1"/>
  <!-- Clipboard / Board -->
  <rect x="9" y="11" width="20" height="20" rx="3" fill="url(#predBg)"/>
  <!-- Clip -->
  <rect x="14" y="8" width="10" height="5" rx="2" fill="#ffffff" stroke="#f97316" stroke-width="1"/>
  <!-- Prediction lines with magnifying glass -->
  <line x1="13" y1="17" x2="25" y2="17" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="13" y1="21" x2="21" y2="21" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Magnifying glass looking at question -->
  <circle cx="24" cy="24" r="4.5" fill="#ffffff" stroke="#ea580c" stroke-width="1.5"/>
  <line x1="27.5" y1="27.5" x2="31" y2="31" stroke="#ea580c" stroke-width="2" stroke-linecap="round"/>
  <text x="24" y="27" fill="#ea580c" font-family="sans-serif" font-weight="900" font-size="6" text-anchor="middle">?</text>
</svg>
