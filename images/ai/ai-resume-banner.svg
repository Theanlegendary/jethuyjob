<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 300" width="220" height="300">
  <defs>
    <linearGradient id="bgNight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="40%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>
    <radialGradient id="glowSphere" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#60a5fa" stop-opacity="0.8"/>
      <stop offset="60%" stop-color="#3b82f6" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#1d4ed8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="220" height="300" rx="8" fill="url(#bgNight)"/>

  <!-- Top Title -->
  <text x="110" y="52" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="25" text-anchor="middle" letter-spacing="2">神笔简历</text>
  <text x="110" y="74" fill="#93c5fd" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="10.5" text-anchor="middle">真“AI” 赋能零基础写简历</text>

  <!-- Glowing Center AI Sphere -->
  <circle cx="110" cy="180" r="75" fill="url(#glowSphere)"/>
  <circle cx="110" cy="180" r="42" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>

  <!-- AI Brain / Digital Grid Inside Sphere -->
  <g transform="translate(90, 160) scale(0.85)">
    <!-- Circuit nodes -->
    <circle cx="10" cy="12" r="3" fill="#67e8f9"/>
    <circle cx="36" cy="12" r="3" fill="#67e8f9"/>
    <circle cx="23" cy="28" r="4" fill="#ffffff"/>
    <circle cx="10" cy="42" r="3" fill="#67e8f9"/>
    <circle cx="36" cy="42" r="3" fill="#67e8f9"/>
    <line x1="10" y1="12" x2="23" y2="28" stroke="#38bdf8" stroke-width="1.5"/>
    <line x1="36" y1="12" x2="23" y2="28" stroke="#38bdf8" stroke-width="1.5"/>
    <line x1="10" y1="42" x2="23" y2="28" stroke="#38bdf8" stroke-width="1.5"/>
    <line x1="36" y1="42" x2="23" y2="28" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="23" y="32" fill="#0f172a" font-family="sans-serif" font-weight="900" font-size="10" text-anchor="middle">AI</text>
  </g>

  <!-- Surrounding Floating Pill Badges -->
  <rect x="25" y="112" width="62" height="18" rx="9" fill="rgba(239, 68, 68, 0.2)" stroke="#f87171" stroke-width="0.8"/>
  <text x="56" y="124" fill="#fca5a5" font-family="sans-serif" font-size="8" font-weight="700" text-anchor="middle">· AI智能诊断</text>

  <rect x="135" y="118" width="60" height="18" rx="9" fill="rgba(168, 85, 247, 0.2)" stroke="#c084fc" stroke-width="0.8"/>
  <text x="165" y="130" fill="#e9d5ff" font-family="sans-serif" font-size="8" font-weight="700" text-anchor="middle">· 简历精炼</text>

  <rect x="15" y="228" width="64" height="18" rx="9" fill="rgba(34, 197, 94, 0.2)" stroke="#4ade80" stroke-width="0.8"/>
  <text x="47" y="240" fill="#bbf7d0" font-family="sans-serif" font-size="8" font-weight="700" text-anchor="middle">· 岗位智能匹配</text>

  <rect x="138" y="232" width="62" height="18" rx="9" fill="rgba(56, 189, 248, 0.2)" stroke="#38bdf8" stroke-width="0.8"/>
  <text x="169" y="244" fill="#bae6fd" font-family="sans-serif" font-size="8" font-weight="700" text-anchor="middle">· 智能简历写</text>

  <!-- Bottom Glow Arc -->
  <path d="M 0 280 Q 110 250 220 280 L 220 300 L 0 300 Z" fill="#2563eb" opacity="0.3"/>
</svg>
